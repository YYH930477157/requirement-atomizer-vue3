  "output_writer",
  "pattern_engine",
  "desktop_backend",
  "desktop_tasks",
  "decide_trace",
  "ai_review_actions",
  "doc_annotation_export",
  "docx_table_parser",
  "doc_facsimile",
  "requirement_schema",
  "resources",
  "review_actions",
  "review_state",
  "review_tools",
  "result_package",
  "requirements_analysis",
  "review_insights",
  "semantic_quality",
  "template_writer",
  "corpus_eval",
  "clarification_report",
  "clarification_check_states",
  "compliance",
  "omission_actions",
