  "requirement_record",
  "adjudication_bank",
  "extract_units",
  "extract_guards",
  "config",
  "requirements_analysis_agent",
  "requirements_analysis_excel",
  "requirements_analysis_rules",
  "requirements_analysis_schema",
  "requirements_analysis_template",
  "spec_enrich",
  "source_spans",
  "spec_excel",
  "spec_export",
  "spot_extract",
  "table_family_templates",
  "table_pattern_engine",
