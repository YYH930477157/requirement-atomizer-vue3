[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.setuptools.package-data]
gui = ["theme.qss.template"]
parsers = ["data/*.gz", "data/*.md"]
# 顶层 schemas/ 以包形式随 wheel 分发——agent_eval/decide_trace 经 Path(__file__).parent
# 相对定位 schema 文件,不打包则安装后 ModuleNotFoundError/FileNotFoundError（审计 P1）
schemas = ["*.json"]
"golden_sets.claim_ledger_v1" = ["*.json", "*.md", "history/*.json"]
# llm_agents/ 与 domain_packs/ 同为包根相对定位（llm_pipeline.DEFAULT_PIPELINE_PATH /
# DEFAULT_DOMAIN_PACK_PATH），无 __init__.py，按 PEP 420 命名空间包随 wheel 分发（审计 R2）
llm_agents = ["*.yaml"]
domain_packs = ["**/*.yaml", "**/*.json"]

[tool.setuptools.packages.find]
include = ["gui*", "parsers*", "requirement_kb*", "schemas", "llm_agents*", "domain_packs*", "golden_sets.claim_ledger_v1"]
