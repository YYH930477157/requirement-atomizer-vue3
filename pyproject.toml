[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "requirement-atomizer"
dynamic = ["version"]
description = "Local pipeline for atomizing technical standards into reviewable atomic requirements."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.1.0",
  "PyYAML>=6.0.0",
  "openpyxl>=3.1.0",
  "pdfplumber>=0.11",
  "jsonschema>=4.23.0",
  "pywin32; sys_platform==\"win32\"",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
package = ["pyinstaller>=6.0"]

[project.scripts]
ratomizer = "cli:main"
requirement-atomizer = "atomize:main"
requirement-review = "llm_pipeline:main"
requirement-api = "api_server:main"
requirement-kb = "requirement_kb.cli:main"
requirement-kb-server = "requirement_kb.server:main"
validate-kb = "requirement_kb.schema:main"
validate-vault = "requirement_kb.vault:main"
validate-atomic-requirements = "atomic_requirement_schema:main"
validate-llm-reviews = "llm_review_schema:main"
claim-shadow-acceptance = "claim_acceptance:main"
claim-shadow-review-packet = "claim_review_packet:main"
claim-shadow-review-import = "claim_review_import:main"

[project.gui-scripts]
ratomizer-gui = "gui.app:main"

[tool.setuptools]
py-modules = [
  "agent_eval",
  "agent_compare",
  "agent_decider",
  "agent_loop",
  "agent_policy",
  "agent_state",
  "agent_tools",
  "ai_extract",
  "claim_artifacts",
  "claim_acceptance",
  "claim_catalog",
  "claim_effective_contract",
  "claim_focus",
  "claim_queue_execution",
  "claim_ledger",
  "claim_reextract_attempts",
  "claim_review_actions",
  "claim_structural_operations",
  "claim_structural_confirmation",
  "claim_structural_overrides",
  "claim_views",
  "table_claim_authority",
  "claim_held_out",
  "claim_review_import",
  "claim_review_packet",
  "merged_consistency",
  "normative_framing",
  "process_file_lock",
  "functional_catalog",
  "functional_synthesis",
  "functional_extract",
  "functional_drilldown",
  "input_completeness",
  "api_server",
  "assemble_spec",
  "atomic_requirement_schema",
  "atomize",
  "blue_book_ingest",
  "blue_book_lookup",
  "cli",
  "cosem_access_security",
  "cosem_behavior_spec",
  "cosem_external_refs",
  "cosem_object_model",
  "doc_ir",
  "doc_ir_export",
  "domain_pack",
  "engineering_composer",
  "export_requirements",
  "extract_cosem_instances",
  "extract_terms",
  "io_utils",
  "llm_client",
